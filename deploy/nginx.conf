server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # nginx resmi belum memetakan .mjs -> JavaScript; tanpa ini pdf.worker.min.mjs dikirim
    # sebagai application/octet-stream dan browser menolak memuat module worker
    # (pratinjau PDF gagal: "Pratinjau belum dapat ditampilkan").
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
